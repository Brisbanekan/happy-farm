<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#8fbf6a">
<title>Farmstead 農莊</title>
<style>
/* ============================================================
   Farmstead — UI 層
   規則：UI 完全獨立於世界 camera。所有尺寸以 --u 為單位，
   --u 由視口依「設計基準 640x360」等比推導 → 各裝置視覺一致。
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#7fb069;
  font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  user-select:none;-webkit-user-select:none;}
img{-webkit-touch-callout:none;-webkit-user-drag:none;}

#game{position:fixed;inset:0;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

/* ---- UI 尺度：--u = 1 設計單位 ---- */
:root{--u:1px;--safeL:env(safe-area-inset-left,0px);--safeR:env(safe-area-inset-right,0px);
  --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
  --ink:#4a3b2a;--panel:#fffdf6;--line:#e4d7bd;--gold:#f0b429;}

.ui{position:absolute;z-index:10;}
.btn{background:var(--panel);border:calc(var(--u)*2.5) solid #ffe2b0;border-radius:calc(var(--u)*16);
  box-shadow:0 calc(var(--u)*4) 0 #e6c893;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink);transition:transform .07s,box-shadow .07s;}
.btn:active{transform:translateY(calc(var(--u)*3));box-shadow:0 calc(var(--u)*1) 0 #e6c893;}
.btn.on{background:#fff3cd;border-color:var(--gold);box-shadow:0 0 0 calc(var(--u)*3) #ffe9a8,0 calc(var(--u)*4) 0 #d9a521;}

/* 主要圓鈕 */
.fab{width:calc(var(--u)*56);height:calc(var(--u)*56);font-size:calc(var(--u)*26);}
.fab small{font-size:calc(var(--u)*11);font-weight:800;margin-top:calc(var(--u)*1);color:#8a7350;}
.ico{display:block;overflow:visible;}
h2 .ico,.tab .ico,.seed .ico,.pill .ico,.meta .ico{display:inline-block;vertical-align:-15%;}

/* 左上：狀態 */
#hud{left:calc(var(--u)*12 + var(--safeL));top:calc(var(--u)*12 + var(--safeT));
  display:flex;flex-direction:column;gap:calc(var(--u)*6);}
.hudrow{display:flex;align-items:center;gap:calc(var(--u)*7);}
.chip{display:flex;align-items:center;gap:calc(var(--u)*5);background:var(--panel);
  border:calc(var(--u)*2.5) solid #ffe2b0;border-radius:calc(var(--u)*20);
  padding:calc(var(--u)*4) calc(var(--u)*11);font-size:calc(var(--u)*15);font-weight:800;color:#7a5a10;
  box-shadow:0 calc(var(--u)*2) calc(var(--u)*5) #0002;}
.chip img{width:calc(var(--u)*20);height:calc(var(--u)*20);}
.lv{width:calc(var(--u)*30);height:calc(var(--u)*30);border-radius:50%;
  background:radial-gradient(#ffd95e,#f0a52a);border:calc(var(--u)*2.5) solid #fff;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*13);font-weight:900;color:#7a4a00;
  box-shadow:0 calc(var(--u)*2) calc(var(--u)*5) #0003;flex:none;}
.xp{width:calc(var(--u)*118);height:calc(var(--u)*15);background:#4a3b2a;border:calc(var(--u)*2.5) solid #fff;
  border-radius:calc(var(--u)*10);overflow:hidden;position:relative;box-shadow:0 calc(var(--u)*2) calc(var(--u)*4) #0003;}
.xp>i{display:block;height:100%;width:0;background:linear-gradient(#b9e08a,#7cb342);transition:width .35s;}
.xp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--u)*10);font-weight:800;color:#fff;text-shadow:0 1px 2px #0008;}
#farmName{background:#00000055;color:#fff;border-radius:calc(var(--u)*9);align-self:flex-start;
  padding:calc(var(--u)*3) calc(var(--u)*10);font-size:calc(var(--u)*12);font-weight:700;}

/* 右側：工具（單一模式列） */
#tools{right:calc(var(--u)*10 + var(--safeR));top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:calc(var(--u)*8);}

/* 底部：主選單 */
#dock{left:50%;transform:translateX(-50%);bottom:calc(var(--u)*10 + var(--safeB));
  display:flex;gap:calc(var(--u)*8);}

/* 右上：縮放 */
#zoom{right:calc(var(--u)*10 + var(--safeR));top:calc(var(--u)*12 + var(--safeT));
  display:flex;flex-direction:column;gap:calc(var(--u)*6);}
#zoom .btn{width:calc(var(--u)*40);height:calc(var(--u)*40);font-size:calc(var(--u)*22);font-weight:900;
  border-radius:calc(var(--u)*12);}

/* 種子快選列 */
#seedbar{left:50%;transform:translateX(-50%);bottom:calc(var(--u)*76 + var(--safeB));
  display:none;gap:calc(var(--u)*6);background:#fffdf6ee;padding:calc(var(--u)*7);
  border-radius:calc(var(--u)*16);border:calc(var(--u)*2.5) solid #ffe2b0;box-shadow:0 calc(var(--u)*4) calc(var(--u)*12) #0003;}
#seedbar.on{display:flex;}
.seed{width:calc(var(--u)*50);height:calc(var(--u)*54);border-radius:calc(var(--u)*12);background:#fff;
  border:calc(var(--u)*2.5) solid #ecdfc4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;}
.seed.on{border-color:var(--gold);background:#fff8e0;}
.seed img{width:calc(var(--u)*28);height:calc(var(--u)*28);}
.seed b{font-size:calc(var(--u)*10);color:#7a5a10;margin-top:calc(var(--u)*1);}
.seed .n{position:absolute;top:calc(var(--u)*-6);right:calc(var(--u)*-6);background:var(--gold);color:#fff;
  border-radius:calc(var(--u)*10);font-size:calc(var(--u)*10);font-weight:900;padding:0 calc(var(--u)*5);
  border:calc(var(--u)*2) solid #fff;}
.seed.lock{opacity:.45;}

/* 提示氣泡 */
#toast{left:50%;top:calc(var(--u)*16 + var(--safeT));transform:translateX(-50%);
  background:#3e3226ee;color:#fff;padding:calc(var(--u)*8) calc(var(--u)*16);border-radius:calc(var(--u)*20);
  font-size:calc(var(--u)*14);font-weight:700;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
  white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(calc(var(--u)*4));}

/* 彈窗 */
#mask{position:fixed;inset:0;background:#00000077;display:none;align-items:center;justify-content:center;
  z-index:50;padding:calc(var(--u)*14);}
#mask.on{display:flex;}
.modal{background:var(--panel);border-radius:calc(var(--u)*20);width:min(calc(var(--u)*460),100%);
  max-height:92%;display:flex;flex-direction:column;overflow:hidden;border:calc(var(--u)*3) solid #e8dcc2;
  box-shadow:0 calc(var(--u)*10) calc(var(--u)*30) #0005;}
.modal h2{padding:calc(var(--u)*12) calc(var(--u)*16);background:#fff7e6;border-bottom:calc(var(--u)*2) solid var(--line);
  font-size:calc(var(--u)*17);display:flex;justify-content:space-between;align-items:center;color:var(--ink);}
.modal .x{background:none;border:none;font-size:calc(var(--u)*22);cursor:pointer;color:#a08e70;line-height:1;}
.mhead{padding:calc(var(--u)*10) calc(var(--u)*16);border-bottom:calc(var(--u)*2) solid var(--line);flex:none;
  display:flex;gap:calc(var(--u)*6);flex-wrap:wrap;background:var(--panel);}
.tab{border:calc(var(--u)*2) solid var(--line);background:#fff;border-radius:calc(var(--u)*20);
  padding:calc(var(--u)*5) calc(var(--u)*13);font-size:calc(var(--u)*13);font-weight:800;cursor:pointer;color:#8a7350;}
.tab.on{background:#fff3cd;border-color:var(--gold);color:#7a5a10;}
.mbody{padding:calc(var(--u)*12) calc(var(--u)*16);overflow:auto;flex:1;min-height:0;}
.row{display:flex;align-items:center;gap:calc(var(--u)*11);padding:calc(var(--u)*9);border-radius:calc(var(--u)*13);
  background:#fbf7ec;margin-bottom:calc(var(--u)*8);border:calc(var(--u)*2) solid #f0e8d6;}
.row img.ic{width:calc(var(--u)*38);height:calc(var(--u)*38);flex:none;}
.row .meta{flex:1;min-width:0;}
.row .meta b{font-size:calc(var(--u)*14);color:var(--ink);display:block;}
.row .meta small{font-size:calc(var(--u)*11.5);color:#8d7b6a;line-height:1.45;display:block;}
.pill{border:none;border-radius:calc(var(--u)*11);padding:calc(var(--u)*8) calc(var(--u)*13);
  font-size:calc(var(--u)*13);font-weight:800;cursor:pointer;background:#ffd76e;color:#6b4d05;
  box-shadow:0 calc(var(--u)*3) 0 #d9a521;flex:none;}
.pill:active{transform:translateY(calc(var(--u)*2));box-shadow:0 calc(var(--u)*1) 0 #d9a521;}
.pill.gray{background:#e8e0d0;color:#9a8a72;box-shadow:0 calc(var(--u)*3) 0 #cdbfa5;}
.pill:disabled{opacity:.5;cursor:default;}
.hint{font-size:calc(var(--u)*12);color:#8d7b6a;line-height:1.6;margin-top:calc(var(--u)*4);}
.lockTag{display:inline-block;background:#ffe3e3;color:#a23b3b;border-radius:calc(var(--u)*8);
  padding:0 calc(var(--u)*6);font-size:calc(var(--u)*11);font-weight:800;}
#loading{position:fixed;inset:0;background:#8fbf6a;display:flex;align-items:center;justify-content:center;
  z-index:99;color:#3f5d2a;font-size:calc(var(--u)*18);font-weight:800;flex-direction:column;gap:calc(var(--u)*10);}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div id="hud" class="ui">
    <div class="hudrow">
      <div class="lv" id="lvBadge">1</div>
      <div class="xp"><i id="xpFill"></i><span id="xpText">0/50</span></div>
    </div>
    <div class="hudrow">
      <div class="chip"><img id="coinIco" alt="">＄<span id="coins">0</span></div>
    </div>
    <div id="farmName">我的農莊</div>
  </div>

  <div id="zoom" class="ui">
    <div class="btn" onclick="Game.zoomBy(1.25)">＋</div>
    <div class="btn" onclick="Game.zoomBy(0.8)">−</div>
  </div>

  <div id="tools" class="ui">
    <div class="btn fab" id="toolPlant" onclick="Game.setTool('plant')"><span data-ic="sprout"></span><small>播種</small></div>
    <div class="btn fab" id="toolWater" onclick="Game.setTool('water')"><span data-ic="drop"></span><small>澆水</small></div>
    <div class="btn fab" id="toolHarvest" onclick="Game.harvestAll()"><span data-ic="basket"></span><small>全收</small></div>
  </div>

  <div id="seedbar" class="ui"></div>

  <div id="dock" class="ui">
    <div class="btn fab" onclick="UI.openShop()"><span data-ic="cart"></span><small>商店</small></div>
    <div class="btn fab" onclick="UI.openBarn()"><span data-ic="bag"></span><small>倉庫</small></div>
    <div class="btn fab" onclick="UI.openAnimals()"><span data-ic="cow"></span><small>牧場</small></div>
  </div>

  <div id="toast" class="ui"></div>
</div>

<div id="mask" onclick="if(event.target===this)UI.close()"><div class="modal" id="modal"></div></div>
<div id="loading"><span data-ic="wheat"></span> Farmstead<div style="font-size:calc(var(--u)*13);font-weight:600">載入中…</div></div>

<script>
"use strict";
/* ============================================================
   Farmstead — 由 Claude 全權設計實作的等角農場遊戲
   架構三層：
     1) State  單一狀態來源 + action 變更 + 自動存檔（含離線續算）
     2) World   canvas 渲染：等角格線 / camera(x,y,zoom) / 數學命中判定
     3) UI      DOM 層，尺度獨立於世界，依設計基準等比縮放
   ============================================================ */

/* ---------------- 設定 ---------------- */
const TILE_W = 128, TILE_H = 64;          // 等角地磚（2:1）
const GRID = 6;                            // 農田 6x6
const DESIGN_W = 640, DESIGN_H = 360;      // UI 設計基準（橫向手機）

const CROPS = {
  carrot : {name:"胡蘿蔔", grow: 30, cost:  10, sell:  22, xp: 3, lv:1},
  tomato : {name:"番茄",   grow: 75, cost:  28, sell:  70, xp: 6, lv:2},
  corn   : {name:"玉米",   grow:180, cost:  60, sell: 168, xp:12, lv:4},
  pumpkin: {name:"南瓜",   grow:420, cost: 140, sell: 430, xp:26, lv:7},
};
const ANIMALS = {
  chicken:{name:"母雞", cost: 220, cycle: 90, yield: 34, product:"egg",  pname:"雞蛋", xp:5,  lv:2},
  cow    :{name:"乳牛", cost: 900, cycle:240, yield:140, product:"milk", pname:"牛奶", xp:14, lv:5},
};
const PLOT_COST = (n) => Math.round(120 * Math.pow(1.55, n - 6));   // 第 7 塊起的地價
const XP_NEED = (lv) => Math.round(50 * Math.pow(1.35, lv - 1));

/* ---------------- 素材 ---------------- */
const IMG = {};
const ASSETS = {
  grass:"tile_grass.png", soil:"tile_soil.png", wet:"tile_wet.png",
  barn:"barn.png", house:"house.png", shop:"shop.png", silo:"silo.png", well:"well.png",
  tree:"tree.png", fence:"fence.png", chicken:"chicken.png", cow:"cow.png",
  coin:"icon_coin.png", egg:"icon_egg.png", milk:"icon_milk.png",
};
for (const k of Object.keys(CROPS)) {
  ASSETS["icon_"+k] = "icon_"+k+".png";
  for (let s=0;s<3;s++) ASSETS["crop_"+k+"_"+s] = "crop_"+k+"_"+s+".png";
}
/* ---------------- 介面圖示（內嵌 SVG，不使用 emoji） ----------------
   emoji 在不同裝置字體不同、風格與遊戲美術不搭，改用向量圖示統一外觀。 */
const SVG = {
  sprout:'<path d="M12 21V11" /><path d="M12 12c0-3.3-2.7-6-6-6 0 3.3 2.7 6 6 6z" fill="#7cc24a" stroke="none"/><path d="M12 13c0-3.9 3.1-7 7-7 0 3.9-3.1 7-7 7z" fill="#5da832" stroke="none"/>',
  drop:'<path d="M12 3c3.6 4.3 6 7.4 6 10a6 6 0 1 1-12 0c0-2.6 2.4-5.7 6-10z" fill="#4bb4e6" stroke="none"/><path d="M9.6 13.4a3.2 3.2 0 0 0 2.2 4" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>',
  basket:'<path d="M4 10h16l-1.6 8.4a2 2 0 0 1-2 1.6H7.6a2 2 0 0 1-2-1.6z" fill="#d9a05b" stroke="none"/><path d="M8 10l2.4-5M16 10l-2.4-5" stroke="#8a5a2b" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M3.4 9h17.2a.9.9 0 0 1 0 1.8H3.4a.9.9 0 0 1 0-1.8z" fill="#8a5a2b" stroke="none"/>',
  cart:'<circle cx="10" cy="19.5" r="1.6" fill="#6b5030" stroke="none"/><circle cx="17" cy="19.5" r="1.6" fill="#6b5030" stroke="none"/><path d="M2.6 4h2.6l2.6 10.4h10l2.2-7.4H6.4" fill="none" stroke="#6b5030" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  bag:'<path d="M5 8h14l-1 12H6z" fill="#e0705f" stroke="none"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8" fill="none" stroke="#a8423a" stroke-width="2"/><rect x="9.5" y="12" width="5" height="3.4" rx="1" fill="#fff2ee" stroke="none"/>',
  cow:'<path d="M4.5 9.5C4.5 6.5 7.8 5 12 5s7.5 1.5 7.5 4.5c0 4-2.6 8-7.5 8s-7.5-4-7.5-8z" fill="#fff" stroke="#5a4632" stroke-width="1.6"/><path d="M6.6 7.2c-1.6-.6-2.9-.3-3.4.8 1 .8 2.3 1 3.4.4zM17.4 7.2c1.6-.6 2.9-.3 3.4.8-1 .8-2.3 1-3.4.4z" fill="#5a4632" stroke="none"/><ellipse cx="12" cy="14" rx="3.4" ry="2.6" fill="#f4b9c0" stroke="none"/><circle cx="10.6" cy="13.8" r=".6" fill="#5a4632" stroke="none"/><circle cx="13.4" cy="13.8" r=".6" fill="#5a4632" stroke="none"/><circle cx="9.4" cy="9.6" r="1" fill="#3d3227" stroke="none"/><circle cx="14.6" cy="9.6" r="1" fill="#3d3227" stroke="none"/>',
  wheat:'<path d="M12 21V9" stroke="#b98b2e" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M12 9c0-2.2 1.4-4 3-4 0 2.2-1.4 4-3 4zM12 9c0-2.2-1.4-4-3-4 0 2.2 1.4 4 3 4zM12 13.5c0-2.2 1.4-4 3-4 0 2.2-1.4 4-3 4zM12 13.5c0-2.2-1.4-4-3-4 0 2.2 1.4 4 3 4z" fill="#e5b93e" stroke="none"/>',
  coin:'<circle cx="12" cy="12" r="8.4" fill="#f2c33d" stroke="#c99a17" stroke-width="1.6"/><circle cx="12" cy="12" r="5.4" fill="none" stroke="#c99a17" stroke-width="1.2"/><path d="M12 8.6v6.8M10.2 10.2h3.2a1.5 1.5 0 0 1 0 3h-2.8a1.5 1.5 0 0 0 0 3h3.2" fill="none" stroke="#8a6a0c" stroke-width="1.4" stroke-linecap="round"/>',
  lock:'<rect x="5.5" y="10.5" width="13" height="9.5" rx="2" fill="#f0d089" stroke="#a8813a" stroke-width="1.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="#a8813a" stroke-width="2"/><circle cx="12" cy="15" r="1.5" fill="#a8813a" stroke="none"/>',
  check:'<circle cx="12" cy="12" r="8.6" fill="#5cb85c" stroke="none"/><path d="M8 12.4l2.8 2.8L16 9.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  star:'<path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z" fill="#f2c33d" stroke="#d09f1c" stroke-width="1.2" stroke-linejoin="round"/>',
  egg:'<ellipse cx="12" cy="13.4" rx="5.6" ry="7.2" fill="#fdf1dc" stroke="#d9bd8e" stroke-width="1.5"/>',
};
/** 產生一個內嵌 SVG 圖示；size 以 --u 為單位縮放 */
function ic(name, u){
  u = u || 24;
  return '<svg class="ico" viewBox="0 0 24 24" style="width:calc(var(--u)*'+u+');height:calc(var(--u)*'+u+')" '
       + 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
       + SVG[name] + '</svg>';
}

/** 把 HTML 裡的 <span data-ic="名稱"> 換成實際 SVG */
function hydrateIcons(root){
  (root || document).querySelectorAll("[data-ic]").forEach(el => {
    if (el.dataset.icDone) return;
    el.innerHTML = ic(el.dataset.ic, +(el.dataset.icu || 24));
    el.dataset.icDone = "1";
  });
}
hydrateIcons();

const ASSET_VER = "ai2";      // 素材版本：換圖後改這裡，避免瀏覽器沿用舊快取
function loadAssets(){
  const keys = Object.keys(ASSETS);
  return Promise.all(keys.map(k => new Promise(res => {
    const im = new Image();
    im.onload = () => { IMG[k] = im; res(); };
    im.onerror = () => { IMG[k] = null; res(); };
    im.src = "assets/" + ASSETS[k] + "?v=" + ASSET_VER;
  })));
}

/* ============================================================
   1) STATE — 單一狀態來源
   ============================================================ */
const State = {
  data: null,
  KEY: "farmstead.save.v1",

  fresh(){
    const plots = [];
    for (let r=0;r<GRID;r++) for (let c=0;c<GRID;c++){
      // 開場開通中央 6 塊，其餘上鎖
      const open = (r>=2 && r<=3 && c>=2 && c<=4) || (r===2&&c===1);
      plots.push({c, r, unlocked: open, crop:null, plantedAt:0, watered:false});
    }
    return {
      v:1, coins: 150, level:1, xp:0,
      seeds:{carrot:5}, store:{},                 // store = 已收成產物
      plots, animals:[], lastSeen: Date.now(), name:"我的農莊",
    };
  },
  load(){
    try{
      const raw = localStorage.getItem(this.KEY);
      this.data = raw ? JSON.parse(raw) : this.fresh();
    }catch(e){ this.data = this.fresh(); }
    // 補欄位（版本相容）
    const f = this.fresh();
    for (const k in f) if (this.data[k] === undefined) this.data[k] = f[k];
    if (!Array.isArray(this.data.plots) || this.data.plots.length !== GRID*GRID) this.data.plots = f.plots;
    return this.data;
  },
  save(){
    this.data.lastSeen = Date.now();
    try{ localStorage.setItem(this.KEY, JSON.stringify(this.data)); }catch(e){}
  },
  reset(){ this.data = this.fresh(); this.save(); },
};
const G = () => State.data;

/* 成長進度 0~1（時間一律用絕對時間戳，離線續算不會有誤差） */
function growth(p, now){
  if (!p.crop) return 0;
  const def = CROPS[p.crop]; if (!def) return 0;
  const dur = def.grow * 1000 * (p.watered ? 0.75 : 1);   // 澆水縮短 25%
  return Math.max(0, Math.min(1, (now - p.plantedAt) / dur));
}
function stageOf(g){ return g >= 1 ? 2 : (g >= 0.45 ? 1 : 0); }

/* 離線續算：動物產出（作物靠時間戳自然成熟，不需補算） */
function offlineTick(){
  const now = Date.now(), last = G().lastSeen || now;
  const away = Math.max(0, now - last);
  let earned = 0, items = 0;
  G().animals.forEach(a => {
    const def = ANIMALS[a.kind]; if (!def) return;
    const cyc = def.cycle * 1000;
    if (!a.readyAt) a.readyAt = now + cyc;
    while (a.readyAt <= now) { a.stock = (a.stock||0) + 1; a.readyAt += cyc; items++; }
    if (a.stock > 12) a.stock = 12;   // 上限，避免離線暴利
  });
  let ripe = 0;
  G().plots.forEach(p => { if (p.crop && growth(p, now) >= 1) ripe++; });
  return {away, items, ripe};
}

/* ---------------- Actions（所有變更集中在此） ---------------- */
const Act = {
  addCoins(n){ G().coins = Math.max(0, Math.round(G().coins + n)); UI.syncHUD(); },
  addXP(n){
    G().xp += n;
    while (G().xp >= XP_NEED(G().level)) { G().xp -= XP_NEED(G().level); G().level++; UI.toast("升級！Lv." + G().level); }
    UI.syncHUD();
  },
  plant(p, kind){
    if (!p.unlocked) return UI.toast("這塊地還沒開通");
    if (p.crop) return UI.toast("這塊地已經種了");
    if ((G().seeds[kind]||0) <= 0) return UI.toast("沒有" + CROPS[kind].name + "種子了");
    if (G().level < CROPS[kind].lv) return UI.toast("需要 Lv." + CROPS[kind].lv);
    G().seeds[kind]--; if (G().seeds[kind] <= 0) delete G().seeds[kind];
    p.crop = kind; p.plantedAt = Date.now(); p.watered = false;
    World.pop(p, "＋種子"); UI.syncSeedbar(); State.save();
  },
  water(p){
    if (!p.crop || p.watered) return false;
    if (growth(p, Date.now()) >= 1) return false;
    p.watered = true;
    // 保持已完成比例：縮短總時長時往前推 plantedAt
    World.pop(p, "＋水"); Act.addXP(1); State.save(); return true;
  },
  harvest(p){
    if (!p.crop || growth(p, Date.now()) < 1) return false;
    const def = CROPS[p.crop];
    G().store[p.crop] = (G().store[p.crop]||0) + 1;
    Act.addXP(def.xp);
    World.pop(p, "＋1");
    p.crop = null; p.watered = false; p.plantedAt = 0;
    State.save(); return true;
  },
  sell(kind, n){
    const have = G().store[kind]||0; n = Math.min(n, have); if (n<=0) return;
    const unit = CROPS[kind] ? CROPS[kind].sell : (kind==="egg"?ANIMALS.chicken.yield:ANIMALS.cow.yield);
    G().store[kind] -= n; if (G().store[kind] <= 0) delete G().store[kind];
    Act.addCoins(unit * n);
    UI.toast("賣出 " + n + " 個，＋" + (unit*n));
    State.save();
  },
  buySeed(kind, n){
    const def = CROPS[kind];
    if (G().level < def.lv) return UI.toast("需要 Lv." + def.lv);
    const total = def.cost * n;
    if (G().coins < total) return UI.toast("金幣不足");
    Act.addCoins(-total); G().seeds[kind] = (G().seeds[kind]||0) + n;
    UI.toast("買了 " + def.name + "種子 ×" + n); UI.syncSeedbar(); State.save();
  },
  buyAnimal(kind){
    const def = ANIMALS[kind];
    if (G().level < def.lv) return UI.toast("需要 Lv." + def.lv);
    if (G().coins < def.cost) return UI.toast("金幣不足");
    if (G().animals.length >= 8) return UI.toast("牧場滿了（上限 8）");
    Act.addCoins(-def.cost);
    G().animals.push({kind, stock:0, readyAt: Date.now() + def.cycle*1000,
      // 牧場區域座標（格線右側）
      ax: 7 + Math.random()*3.2, ay: 1 + Math.random()*4.2, dir: 1, tx:null, ty:null, nextMove:0});
    UI.toast("歡迎 " + def.name + "！"); State.save();
  },
  collectAnimal(a){
    if (!a.stock) return false;
    const def = ANIMALS[a.kind];
    G().store[def.product] = (G().store[def.product]||0) + a.stock;
    UI.toast("收成 " + def.pname + " ×" + a.stock);
    a.stock = 0; Act.addXP(def.xp); State.save(); return true;
  },
  unlockPlot(p){
    const n = G().plots.filter(x=>x.unlocked).length;
    const cost = PLOT_COST(n+1);
    if (G().coins < cost) return UI.toast("需要 ＄" + cost);
    Act.addCoins(-cost); p.unlocked = true; Act.addXP(5);
    UI.toast("開通新田地！"); State.save();
  },
};

/* ============================================================
   2) WORLD — canvas 渲染 + camera
   ============================================================ */
const World = {
  cv:null, ctx:null, dpr:1, w:0, h:0,
  cam:{x:0, y:0, zoom:1},
  minZoom:0.45, maxZoom:1.8,
  pops:[],           // 浮動文字
  hover:null,

  init(){
    this.cv = document.getElementById("cv");
    this.ctx = this.cv.getContext("2d");
    this.resize();
    addEventListener("resize", () => this.resize());
    if (window.visualViewport) visualViewport.addEventListener("resize", () => this.resize());
    this.centerOnFarm();
    Input.bind(this.cv);
  },
  resize(){
    const vv = window.visualViewport;
    this.w = Math.round((vv && vv.width) || innerWidth);
    this.h = Math.round((vv && vv.height) || innerHeight);
    this.dpr = Math.min(devicePixelRatio || 1, 2.5);
    this.cv.width = Math.round(this.w * this.dpr);
    this.cv.height = Math.round(this.h * this.dpr);
    this.cv.style.width = this.w + "px";
    this.cv.style.height = this.h + "px";
    UI.applyScale(this.w, this.h);
    this.clampCam();
  },

  /* --- 座標換算：格 ↔ 世界 ↔ 螢幕 --- */
  gridToWorld(c, r){ return {x:(c - r) * TILE_W/2, y:(c + r) * TILE_H/2}; },
  worldToScreen(x, y){
    return {x:(x - this.cam.x) * this.cam.zoom + this.w/2,
            y:(y - this.cam.y) * this.cam.zoom + this.h/2};
  },
  screenToWorld(sx, sy){
    return {x:(sx - this.w/2)/this.cam.zoom + this.cam.x,
            y:(sy - this.h/2)/this.cam.zoom + this.cam.y};
  },
  worldToGrid(x, y){   // 反等角：純數學，不需逐像素判定
    const c = (y / (TILE_H/2) + x / (TILE_W/2)) / 2;
    const r = (y / (TILE_H/2) - x / (TILE_W/2)) / 2;
    return {c: Math.floor(c), r: Math.floor(r)};
  },
  plotAt(c, r){
    if (c<0||r<0||c>=GRID||r>=GRID) return null;
    return G().plots[r*GRID + c] || null;
  },

  centerOnFarm(){
    const a = this.gridToWorld(GRID/2 - 0.5, GRID/2 - 0.5);
    this.cam.x = a.x; this.cam.y = a.y - 46;   // 略往上：讓農田在下方、建築在上方都入鏡
    this.cam.zoom = this.fitZoom() * 1.05;
    this.clampCam();
  },
  fitZoom(){
    // 讓農田＋周邊建築大致入鏡的縮放
    const spanX = (GRID + 6) * TILE_W/2, spanY = (GRID + 6) * TILE_H;
    return Math.min(this.w / spanX, this.h / spanY);
  },
  clampCam(){
    this.minZoom = Math.max(0.32, this.fitZoom() * 0.72);
    this.cam.zoom = Math.max(this.minZoom, Math.min(this.maxZoom, this.cam.zoom));
    // 限制在世界範圍附近，避免飛出去
    const lim = 900;
    const cen = this.gridToWorld(GRID/2 - 0.5, GRID/2 - 0.5);
    this.cam.x = Math.max(cen.x - lim, Math.min(cen.x + lim, this.cam.x));
    this.cam.y = Math.max(cen.y - lim*0.6, Math.min(cen.y + lim*0.6, this.cam.y));
  },
  zoomAt(factor, sx, sy){
    const before = this.screenToWorld(sx, sy);
    this.cam.zoom = Math.max(this.minZoom, Math.min(this.maxZoom, this.cam.zoom * factor));
    const after = this.screenToWorld(sx, sy);
    this.cam.x += before.x - after.x;
    this.cam.y += before.y - after.y;
    this.clampCam();
  },
  /** 在 canvas 上畫一個鎖（取代 emoji，跨平台外觀一致） */
  drawLock(x, y, size){
    const ctx = this.ctx, w = size, h = size * 0.78, r = w * 0.18;
    ctx.save();
    ctx.translate(x, y);
    // 鎖環
    ctx.beginPath();
    ctx.lineWidth = Math.max(1, w * 0.16);
    ctx.strokeStyle = "#f7e7bb";
    ctx.arc(0, -h * 0.42, w * 0.28, Math.PI, 0);
    ctx.stroke();
    // 鎖身
    ctx.beginPath();
    const x0 = -w/2, y0 = -h*0.12;
    ctx.moveTo(x0 + r, y0);
    ctx.arcTo(x0 + w, y0,     x0 + w, y0 + h, r);
    ctx.arcTo(x0 + w, y0 + h, x0,     y0 + h, r);
    ctx.arcTo(x0,     y0 + h, x0,     y0,     r);
    ctx.arcTo(x0,     y0,     x0 + w, y0,     r);
    ctx.closePath();
    ctx.fillStyle = "#f2d489"; ctx.fill();
    ctx.lineWidth = Math.max(1, w * 0.1); ctx.strokeStyle = "#a8813a"; ctx.stroke();
    // 鑰匙孔
    ctx.beginPath();
    ctx.fillStyle = "#a8813a";
    ctx.arc(0, y0 + h * 0.45, w * 0.11, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  },
  pop(p, text){
    const w = this.gridToWorld(p.c !== undefined ? p.c : p.ax, p.r !== undefined ? p.r : p.ay);
    this.pops.push({x:w.x, y:w.y - 30, text, t:0});
  },
  popAt(x, y, text){ this.pops.push({x, y:y-20, text, t:0}); },

  /* --- 繪製 --- */
  draw(now){
    const ctx = this.ctx;
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    // 天空/草地底色
    const g = ctx.createLinearGradient(0,0,0,this.h);
    g.addColorStop(0,"#a9d6f0"); g.addColorStop(0.42,"#bfe3a8"); g.addColorStop(1,"#8ec46a");
    ctx.fillStyle = g; ctx.fillRect(0,0,this.w,this.h);

    const items = [];   // 收集可繪物件 → 依深度排序
    const push = (depth, fn) => items.push({depth, fn});

    // 草地底盤（比農田大一圈）
    for (let r=-3;r<GRID+3;r++) for (let c=-3;c<GRID+3;c++){
      const inFarm = (c>=0&&r>=0&&c<GRID&&r<GRID);
      const w = this.gridToWorld(c, r);
      const s = this.worldToScreen(w.x, w.y);
      if (s.x < -200 || s.x > this.w+200 || s.y < -200 || s.y > this.h+260) continue;
      if (inFarm) continue;
      push(c+r-0.5, () => this.blit(IMG.grass, s.x, s.y, 1));
    }

    // 農田
    const zoom = this.cam.zoom;
    for (let r=0;r<GRID;r++) for (let c=0;c<GRID;c++){
      const p = this.plotAt(c,r); if (!p) continue;
      const w = this.gridToWorld(c, r);
      const s = this.worldToScreen(w.x, w.y);
      if (s.x < -220 || s.x > this.w+220 || s.y < -220 || s.y > this.h+300) continue;
      const depth = c + r;
      push(depth, () => {
        if (!p.unlocked){
          this.blit(IMG.grass, s.x, s.y, 1);
          // 上鎖：半透明遮罩 + 鎖
          this.ctx.save();
          this.ctx.globalAlpha = 0.34; this.ctx.fillStyle = "#2b3a20";
          this.diamondPath(s.x, s.y, zoom); this.ctx.fill();
          this.ctx.restore();
          this.drawLock(s.x, s.y + 4*zoom, 16*zoom);
          return;
        }
        const img = p.watered && p.crop ? IMG.wet : (p.crop ? IMG.soil : IMG.soil);
        this.blit(img, s.x, s.y, 1);
        if (this.hover && this.hover.c===c && this.hover.r===r){
          this.ctx.save(); this.ctx.globalAlpha=.25; this.ctx.fillStyle="#fff";
          this.diamondPath(s.x, s.y, zoom); this.ctx.fill(); this.ctx.restore();
        }
        if (p.crop){
          const gr = growth(p, now), st = stageOf(gr);
          const im = IMG["crop_"+p.crop+"_"+st];
          this.blit(im, s.x, s.y + 8*zoom, 1.45);      // 作物放大，視覺份量足夠
          if (st === 2){
            // 成熟標記：跳動的產物圖示
            const bob = Math.sin(now/300 + (c+r)) * 3;
            this.blit(IMG["icon_"+p.crop], s.x, s.y - 74*zoom + bob*zoom, 0.8);
          } else {
            // 成長進度條
            this.bar(s.x, s.y - 40*zoom, 44*zoom, 7*zoom, gr);
          }
        }
      });
    }

    // 裝飾與建築（放在農田外圍格）
    const decor = [
      {img:IMG.barn,  c:-1.6, r:-1.6, s:1},
      {img:IMG.house, c: 3.2, r:-2.6, s:1},
      {img:IMG.shop,  c:-2.6, r: 3.0, s:1},
      {img:IMG.silo,  c:-1.2, r:-2.9, s:0.86},
      {img:IMG.well,  c: 6.6, r:-1.2, s:1},
      {img:IMG.tree,  c:-2.8, r: 0.4, s:1},
      {img:IMG.tree,  c: 7.2, r: 5.6, s:1},
      {img:IMG.tree,  c:-1.0, r: 7.0, s:0.9},
      {img:IMG.tree,  c: 6.0, r: 7.4, s:1},
    ];
    decor.forEach(d => {
      const w = this.gridToWorld(d.c, d.r);
      const s = this.worldToScreen(w.x, w.y);
      if (s.x < -320 || s.x > this.w+320 || s.y < -320 || s.y > this.h+320) return;
      push(d.c + d.r, () => this.blit(d.img, s.x, s.y, d.s));
    });

    // 牧場圍籬：左側界線 + 下側界線，圍出右方牧場區
    for (let i=0;i<6;i++){
      const w1 = this.gridToWorld(6.3, i*0.98 + 0.1), s1 = this.worldToScreen(w1.x, w1.y);
      push(6.3 + i*0.98, () => this.blit(IMG.fence, s1.x, s1.y, 0.92));
    }
    for (let i=0;i<4;i++){
      const w2 = this.gridToWorld(6.9 + i*0.98, 5.6), s2 = this.worldToScreen(w2.x, w2.y);
      push(6.9 + i*0.98 + 5.6, () => this.blit(IMG.fence, s2.x, s2.y, 0.92, true));
    }

    // 動物
    G().animals.forEach((a, i) => {
      this.stepAnimal(a, now);
      const w = this.gridToWorld(a.ax, a.ay);
      const s = this.worldToScreen(w.x, w.y);
      if (s.x < -200 || s.x > this.w+200) return;
      push(a.ax + a.ay + 0.1, () => {
        this.blit(IMG[a.kind], s.x, s.y, 1, a.dir < 0);
        if (a.stock > 0){
          const bob = Math.sin(now/280 + i) * 3;
          const def = ANIMALS[a.kind];
          this.blit(IMG[def.product], s.x, s.y - 52*zoom + bob*zoom, 0.6);
          if (a.stock > 1) this.text("×"+a.stock, s.x + 16*zoom, s.y - 48*zoom + bob*zoom, 12*zoom, "#fff", "#3e3226");
        }
      });
    });

    items.sort((a,b) => a.depth - b.depth);
    items.forEach(it => it.fn());

    // 浮動文字
    for (let i=this.pops.length-1;i>=0;i--){
      const f = this.pops[i]; f.t += 1/60;
      if (f.t > 1.1){ this.pops.splice(i,1); continue; }
      const s = this.worldToScreen(f.x, f.y - f.t*40);
      this.ctx.save();
      this.ctx.globalAlpha = Math.max(0, 1 - f.t/1.1);
      this.text(f.text, s.x, s.y, 17*Math.max(0.8,zoom), "#fff", "#3e3226");
      this.ctx.restore();
    }
  },
  stepAnimal(a, now){
    const def = ANIMALS[a.kind]; if (!def) return;
    if (!a.readyAt) a.readyAt = now + def.cycle*1000;
    if (now >= a.readyAt){ a.stock = Math.min(12, (a.stock||0)+1); a.readyAt = now + def.cycle*1000; }
    if (!a.nextMove || now > a.nextMove){
      a.tx = 6.9 + Math.random()*3.4; a.ty = 0.6 + Math.random()*4.6;
      a.nextMove = now + 2600 + Math.random()*4200;
    }
    if (a.tx != null){
      const dx = a.tx - a.ax, dy = a.ty - a.ay;
      const d = Math.hypot(dx, dy);
      if (d > 0.02){
        const sp = 0.0045;
        a.ax += dx/d * sp; a.ay += dy/d * sp;
        a.dir = (dx - dy) >= 0 ? 1 : -1;
      }
    }
  },
  diamondPath(sx, sy, z){
    const ctx = this.ctx, hw = TILE_W/2*z, hh = TILE_H/2*z;
    ctx.beginPath();
    ctx.moveTo(sx, sy-hh); ctx.lineTo(sx+hw, sy); ctx.lineTo(sx, sy+hh); ctx.lineTo(sx-hw, sy);
    ctx.closePath();
  },
  blit(img, sx, sy, scale, flip){
    if (!img) return;
    const z = this.cam.zoom * (scale||1);
    const w = img.width * z, h = img.height * z;
    const ctx = this.ctx;
    if (flip){
      ctx.save(); ctx.translate(sx, sy); ctx.scale(-1,1);
      ctx.drawImage(img, -w/2, -h + TILE_H/2*this.cam.zoom, w, h);
      ctx.restore();
    } else {
      ctx.drawImage(img, sx - w/2, sy - h + TILE_H/2*this.cam.zoom, w, h);
    }
  },
  bar(sx, sy, w, h, t){
    const ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = "#2e2418cc";
    ctx.beginPath(); ctx.roundRect(sx-w/2, sy, w, h, h/2); ctx.fill();
    ctx.fillStyle = t > 0.66 ? "#ffd54f" : "#8fd14f";
    ctx.beginPath(); ctx.roundRect(sx-w/2+h*0.18, sy+h*0.18, Math.max(2,(w-h*0.36)*t), h*0.64, h*0.32); ctx.fill();
    ctx.lineWidth = Math.max(1, h*0.18); ctx.strokeStyle = "#ffffffcc";
    ctx.beginPath(); ctx.roundRect(sx-w/2, sy, w, h, h/2); ctx.stroke();
    ctx.restore();
  },
  text(t, x, y, size, color, stroke){
    const ctx = this.ctx;
    ctx.save();
    ctx.font = "900 " + Math.max(9,size) + "px system-ui,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (stroke){ ctx.lineWidth = Math.max(2,size*0.28); ctx.strokeStyle = stroke; ctx.strokeText(t,x,y); }
    ctx.fillStyle = color; ctx.fillText(t,x,y);
    ctx.restore();
  },
};

/* ============================================================
   INPUT — 拖曳平移 / 縮放 / 點擊互動
   ============================================================ */
const Input = {
  down:false, moved:false, sx:0, sy:0, camx:0, camy:0, pointers:new Map(), pinch:0,
  bind(cv){
    cv.addEventListener("pointerdown", e => this.onDown(e));
    cv.addEventListener("pointermove", e => this.onMove(e));
    cv.addEventListener("pointerup",   e => this.onUp(e));
    cv.addEventListener("pointercancel", e => this.onUp(e));
    cv.addEventListener("pointerleave", e => { World.hover = null; });
    cv.addEventListener("wheel", e => {
      e.preventDefault();
      World.zoomAt(e.deltaY < 0 ? 1.12 : 1/1.12, e.clientX, e.clientY);
    }, {passive:false});
  },
  onDown(e){
    this.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (this.pointers.size === 2){
      const [a,b] = [...this.pointers.values()];
      this.pinch = Math.hypot(a.x-b.x, a.y-b.y);
      this.down = false; return;
    }
    this.down = true; this.moved = false;
    this.sx = e.clientX; this.sy = e.clientY;
    this.camx = World.cam.x; this.camy = World.cam.y;
  },
  onMove(e){
    if (this.pointers.has(e.pointerId)) this.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (this.pointers.size === 2){
      const [a,b] = [...this.pointers.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if (this.pinch > 0 && Math.abs(d-this.pinch) > 1){
        World.zoomAt(d/this.pinch, (a.x+b.x)/2, (a.y+b.y)/2);
        this.pinch = d;
      }
      return;
    }
    if (!this.down){
      // hover 高亮（桌機）
      const w = World.screenToWorld(e.clientX, e.clientY);
      const g = World.worldToGrid(w.x, w.y);
      World.hover = World.plotAt(g.c, g.r) ? g : null;
      return;
    }
    const dx = e.clientX - this.sx, dy = e.clientY - this.sy;
    if (!this.moved && Math.abs(dx)+Math.abs(dy) > 10) this.moved = true;
    if (this.moved){
      World.cam.x = this.camx - dx / World.cam.zoom;
      World.cam.y = this.camy - dy / World.cam.zoom;
      World.clampCam();
    }
  },
  onUp(e){
    this.pointers.delete(e.pointerId);
    if (this.pointers.size < 2) this.pinch = 0;
    if (!this.down) return;
    this.down = false;
    if (this.moved) return;          // 拖曳過就不算點擊
    Game.tapAt(e.clientX, e.clientY);
  },
};

/* ============================================================
   3) GAME — 玩法邏輯（工具模式與互動）
   ============================================================ */
const Game = {
  tool:"plant", seed:"carrot",
  setTool(t){
    this.tool = (this.tool === t) ? "" : t;     // 再按一次取消
    UI.syncTools();
  },
  zoomBy(f){ World.zoomAt(f, World.w/2, World.h/2); },

  tapAt(sx, sy){
    // 先判定動物（比格子優先，因為牠們站在格子上）
    const now = Date.now();
    let hitAnimal = null, bestD = 1e9;
    G().animals.forEach(a => {
      const w = World.gridToWorld(a.ax, a.ay);
      const s = World.worldToScreen(w.x, w.y);
      const d = Math.hypot(sx - s.x, sy - (s.y - 22*World.cam.zoom));
      if (d < 34*World.cam.zoom && d < bestD){ bestD = d; hitAnimal = a; }
    });
    if (hitAnimal){
      if (!Act.collectAnimal(hitAnimal)){
        const def = ANIMALS[hitAnimal.kind];
        const left = Math.max(0, Math.ceil((hitAnimal.readyAt - now)/1000));
        UI.toast(def.name + " 生產中… " + fmtTime(left));
      }
      return;
    }
    const w = World.screenToWorld(sx, sy);
    const g = World.worldToGrid(w.x, w.y);
    const p = World.plotAt(g.c, g.r);
    if (!p) return;

    if (!p.unlocked){
      const n = G().plots.filter(x=>x.unlocked).length;
      UI.confirmUnlock(p, PLOT_COST(n+1));
      return;
    }
    // 智慧互動：成熟→收成；有作物且工具是澆水→澆水；空地→播種
    const gr = growth(p, now);
    if (p.crop && gr >= 1){ Act.harvest(p); return; }
    if (this.tool === "water"){
      if (!Act.water(p)) UI.toast(p.crop ? "已經澆過水了" : "這裡還沒種東西");
      return;
    }
    if (!p.crop){
      if (this.tool === "plant" || !this.tool) Act.plant(p, this.seed);
      return;
    }
    UI.toast(CROPS[p.crop].name + " 成長中… " + fmtTime(Math.ceil((1-gr) * CROPS[p.crop].grow * (p.watered?0.75:1))));
  },

  harvestAll(){
    const now = Date.now();
    let n = 0;
    G().plots.forEach(p => { if (p.crop && growth(p, now) >= 1 && Act.harvest(p)) n++; });
    UI.toast(n ? ("收成了 " + n + " 塊田") : "目前沒有成熟的作物");
  },
  plantAll(){
    let n = 0;
    G().plots.forEach(p => {
      if (p.unlocked && !p.crop && (G().seeds[this.seed]||0) > 0){ Act.plant(p, this.seed); n++; }
    });
    UI.toast(n ? ("播種了 " + n + " 塊田") : "沒有空地或種子不足");
  },
  waterAll(){
    let n = 0;
    G().plots.forEach(p => { if (Act.water(p)) n++; });
    UI.toast(n ? ("澆了 " + n + " 塊田") : "沒有需要澆水的田");
  },
};
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + " 秒";
  const m = Math.floor(sec/60), s = sec%60;
  if (m < 60) return m + " 分" + (s? " "+s+" 秒":"");
  return Math.floor(m/60) + " 小時 " + (m%60) + " 分";
}

/* ============================================================
   UI — DOM 層（尺度獨立於世界）
   ============================================================ */
const UI = {
  applyScale(w, h){
    // 依設計基準等比推導 --u；手機小螢幕自動放大係數，避免元件過小
    const s = Math.min(w / DESIGN_W, h / DESIGN_H);
    const u = Math.max(0.78, Math.min(1.6, s));
    document.documentElement.style.setProperty("--u", u + "px");
  },
  toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(this._tt); this._tt = setTimeout(()=>t.classList.remove("on"), 1700);
  },
  syncHUD(){
    document.getElementById("coins").textContent = Math.floor(G().coins).toLocaleString();
    document.getElementById("lvBadge").textContent = G().level;
    const need = XP_NEED(G().level);
    document.getElementById("xpFill").style.width = Math.min(100, G().xp/need*100) + "%";
    document.getElementById("xpText").textContent = G().xp + "/" + need;
    document.getElementById("farmName").textContent = G().name;
  },
  syncTools(){
    document.getElementById("toolPlant").classList.toggle("on", Game.tool === "plant");
    document.getElementById("toolWater").classList.toggle("on", Game.tool === "water");
    document.getElementById("seedbar").classList.toggle("on", Game.tool === "plant");
  },
  syncSeedbar(){
    const bar = document.getElementById("seedbar");
    bar.innerHTML = "";
    Object.keys(CROPS).forEach(k => {
      const def = CROPS[k], n = G().seeds[k]||0, lock = G().level < def.lv;
      const el = document.createElement("div");
      el.className = "seed" + (Game.seed===k?" on":"") + (lock?" lock":"");
      el.innerHTML = '<img src="assets/icon_'+k+'.png" alt=""><b>'+def.name+'</b>'
                   + (n? '<span class="n">'+n+'</span>' : '');
      el.onclick = () => {
        if (lock) return UI.toast("需要 Lv." + def.lv);
        Game.seed = k; UI.syncSeedbar();
      };
      bar.appendChild(el);
    });
    // 批次播種
    const all = document.createElement("div");
    all.className = "seed";
    all.innerHTML = '<b style="font-size:calc(var(--u)*11)">'+ic("sprout",14)+'全種</b>';
    all.onclick = () => Game.plantAll();
    bar.appendChild(all);
    const wat = document.createElement("div");
    wat.className = "seed";
    wat.innerHTML = '<b style="font-size:calc(var(--u)*11)">'+ic("drop",14)+'全澆</b>';
    wat.onclick = () => Game.waterAll();
    bar.appendChild(wat);
  },

  show(html){
    document.getElementById("modal").innerHTML = html;
    document.getElementById("mask").classList.add("on");
  },
  close(){ document.getElementById("mask").classList.remove("on"); },

  openShop(tab){
    tab = tab || "seed";
    let body = "";
    if (tab === "seed"){
      Object.keys(CROPS).forEach(k => {
        const d = CROPS[k], lock = G().level < d.lv;
        body += '<div class="row"><img class="ic" src="assets/icon_'+k+'.png" alt="">'
          + '<div class="meta"><b>'+d.name+'種子</b><small>成長 '+fmtTime(d.grow)+' ｜ 收成賣 ＄'+d.sell+' ｜ 經驗 '+d.xp
          + (lock? ' ｜ <span class="lockTag">需 Lv.'+d.lv+'</span>':'')+'</small></div>'
          + '<button class="pill" '+(lock?'disabled':'')+' onclick="Act.buySeed(\''+k+'\',1);UI.openShop(\'seed\')">＄'+d.cost+'</button>'
          + '<button class="pill gray" '+(lock?'disabled':'')+' onclick="Act.buySeed(\''+k+'\',10);UI.openShop(\'seed\')">×10</button></div>';
      });
    } else {
      Object.keys(ANIMALS).forEach(k => {
        const d = ANIMALS[k], lock = G().level < d.lv;
        body += '<div class="row"><img class="ic" src="assets/'+k+'.png" alt="">'
          + '<div class="meta"><b>'+d.name+'</b><small>每 '+fmtTime(d.cycle)+' 產 1 個'+d.pname+'（賣 ＄'+d.yield+'）'
          + (lock? ' ｜ <span class="lockTag">需 Lv.'+d.lv+'</span>':'')+'</small></div>'
          + '<button class="pill" '+(lock?'disabled':'')+' onclick="Act.buyAnimal(\''+k+'\');UI.openShop(\'animal\')">＄'+d.cost+'</button></div>';
      });
      body += '<p class="hint">動物會在右側牧場自由走動，產物出現時點一下即可收成。</p>';
    }
    this.show('<h2>'+ic("cart",20)+' 商店<button class="x" onclick="UI.close()">×</button></h2>'
      + '<div class="mhead"><button class="tab '+(tab==="seed"?"on":"")+'" onclick="UI.openShop(\'seed\')">'+ic("sprout",16)+' 種子</button>'
      + '<button class="tab '+(tab==="animal"?"on":"")+'" onclick="UI.openShop(\'animal\')">'+ic("cow",16)+' 動物</button></div>'
      + '<div class="mbody">'+body+'</div>');
  },

  openBarn(){
    const keys = Object.keys(G().store).filter(k => G().store[k] > 0);
    let body = "", total = 0;
    if (!keys.length) body = '<p class="hint">倉庫是空的，去田裡收成吧。</p>';
    keys.forEach(k => {
      const isCrop = !!CROPS[k];
      const name = isCrop ? CROPS[k].name : (k==="egg"?"雞蛋":"牛奶");
      const unit = isCrop ? CROPS[k].sell : (k==="egg"?ANIMALS.chicken.yield:ANIMALS.cow.yield);
      const n = G().store[k]; total += unit*n;
      const ico = isCrop ? ("icon_"+k+".png") : ("icon_"+k+".png");
      body += '<div class="row"><img class="ic" src="assets/'+ico+'" alt="">'
        + '<div class="meta"><b>'+name+' ×'+n+'</b><small>單價 ＄'+unit+'　小計 ＄'+(unit*n)+'</small></div>'
        + '<button class="pill" onclick="Act.sell(\''+k+'\',1);UI.openBarn()">賣 1</button>'
        + '<button class="pill" onclick="Act.sell(\''+k+'\','+n+');UI.openBarn()">全賣</button></div>';
    });
    if (keys.length) body += '<button class="pill" style="width:100%;margin-top:calc(var(--u)*6)" onclick="UI.sellAll()">'+ic("coin",16)+' 全部賣掉（＄'+total+'）</button>';
    this.show('<h2>'+ic("bag",20)+' 倉庫<button class="x" onclick="UI.close()">×</button></h2><div class="mbody">'+body+'</div>');
  },
  sellAll(){
    Object.keys(G().store).forEach(k => Act.sell(k, G().store[k]));
    this.openBarn();
  },
  openAnimals(){
    let body = "";
    if (!G().animals.length) body = '<p class="hint">還沒有動物，到「商店 → 動物」購買。</p>';
    G().animals.forEach((a,i) => {
      const d = ANIMALS[a.kind];
      const left = Math.max(0, Math.ceil((a.readyAt - Date.now())/1000));
      body += '<div class="row"><img class="ic" src="assets/'+a.kind+'.png" alt="">'
        + '<div class="meta"><b>'+d.name+'</b><small>'
        + (a.stock ? (ic("check",14)+' 可收成 '+d.pname+' ×'+a.stock) : ('生產中… 還要 '+fmtTime(left)))
        + '</small></div>'
        + (a.stock ? '<button class="pill" onclick="Act.collectAnimal(G().animals['+i+']);UI.openAnimals()">收成</button>' : '')
        + '</div>';
    });
    if (G().animals.length){
      body += '<button class="pill" style="width:100%" onclick="UI.collectAll()">'+ic("basket",16)+' 全部收成</button>';
    }
    this.show('<h2>'+ic("cow",20)+' 牧場<button class="x" onclick="UI.close()">×</button></h2><div class="mbody">'+body+'</div>');
  },
  collectAll(){
    let n = 0;
    G().animals.forEach(a => { if (Act.collectAnimal(a)) n++; });
    UI.toast(n ? ("收成了 "+n+" 隻動物的產物") : "還沒有可收成的產物");
    this.openAnimals();
  },
  confirmUnlock(p, cost){
    this.show('<h2>'+ic("lock",20)+' 開通田地<button class="x" onclick="UI.close()">×</button></h2>'
      + '<div class="mbody"><p class="hint">花費 ＄'+cost+' 開通這塊田地，可以種更多作物。</p>'
      + '<button class="pill" style="width:100%" onclick="Act.unlockPlot(G().plots['+(p.r*GRID+p.c)+']);UI.close()">＄'+cost+' 開通</button></div>');
  },
  welcome(info){
    if (info.away < 60000 && !info.ripe && !info.items) return;
    let s = "";
    if (info.away >= 60000) s += '<p class="hint">你離開了 '+fmtTime(info.away/1000)+'。</p>';
    if (info.ripe) s += '<div class="row"><div class="meta"><b>'+ic("wheat",16)+' '+info.ripe+' 塊田已成熟</b><small>點田地或按「全收」收成</small></div></div>';
    if (info.items) s += '<div class="row"><div class="meta"><b>'+ic("egg",16)+' 動物產出 '+info.items+' 個</b><small>到牧場點動物收成</small></div></div>';
    if (!s) return;
    this.show('<h2>歡迎回來<button class="x" onclick="UI.close()">×</button></h2><div class="mbody">'+s
      + '<button class="pill" style="width:100%" onclick="Game.harvestAll();UI.collectAll();UI.close()">一鍵全部收成</button></div>');
  },
};

/* ============================================================
   啟動
   ============================================================ */
function boot(){
  State.load();
  const info = offlineTick();
  World.init();
  UI.syncHUD(); UI.syncTools(); UI.syncSeedbar();
  document.getElementById("coinIco").src = "assets/icon_coin.png";
  document.getElementById("loading").style.display = "none";
  setTimeout(()=>UI.welcome(info), 350);

  let last = 0;
  function loop(ts){
    const now = Date.now();
    World.draw(now);
    if (ts - last > 1000){ last = ts; State.save(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  addEventListener("visibilitychange", () => { if (document.hidden) State.save(); });
}
loadAssets().then(boot);
</script>
